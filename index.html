</head>
<body x-data="kikwetuMasterHub()" x-init="init()" :class="darkMode ? 'dark bg-brand-bgDark text-gray-100' : 'bg-brand-bgLight text-gray-900'" class="transition-colors duration-300 font-sans min-h-screen flex flex-col selection:bg-brand-orange selection:text-white">

    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebApplication","name":"KikwetuConnect","description":"East African Knowledge & Community Network","applicationCategory":"SocialNetworkingApplication","operatingSystem":"Web, Android, iOS"}
    </script>

    <!-- ═══════ NAVBAR ═══════ -->
    <header class="sticky top-0 z-50 border-b border-gray-200/60 dark:border-gray-800/60 bg-white/80 dark:bg-brand-cardDark/80 backdrop-blur-xl transition-all" :class="scrolled ? 'shadow-lg' : ''">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5 cursor-pointer group" @click="go(isLoggedIn ? 'feed' : 'landing')">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-brand-green flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-shield-halved text-sm sm:text-lg text-brand-orange"></i>
                </div>
                <div class="hidden sm:block">
                    <span class="text-lg sm:text-xl font-bold tracking-tight font-logo text-brand-green dark:text-white">Kikwetu<span class="text-brand-orange">Connect</span></span>
                    <span class="block text-[9px] uppercase tracking-[0.2em] text-gray-400 font-medium -mt-0.5">Our Place</span>
                </div>
            </div>
            <div class="hidden md:flex flex-1 max-w-lg mx-6 relative" x-show="isLoggedIn">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" x-model="searchQuery" data-search-input placeholder="Tafuta (Search) questions, #KilimoSmart, spaces..." class="w-full pl-10 pr-10 py-2.5 rounded-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/80 focus:outline-none focus:ring-2 focus:ring-brand-orange/50 focus:border-brand-orange text-sm transition-all">
                <button @click="toggleVoice()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-orange transition-colors" :class="isListening ? 'text-red-500 animate-pulse' : ''"><i class="fa-solid fa-microphone text-sm"></i></button>
            </div>
            <nav class="hidden lg:flex items-center space-x-1 text-sm font-medium" x-show="!isLoggedIn">
                <button @click="go(isLoggedIn ? 'feed' : 'landing')" :class="(isLoggedIn && currentRoute==='feed') || (!isLoggedIn && currentRoute==='landing') ? 'text-brand-orange bg-brand-orange/10' : 'text-gray-600 dark:text-gray-300 hover:text-brand-orange'" class="px-3 py-2 rounded-lg transition-all" x-text="isLoggedIn ? 'Feed' : 'Home'"></button>
                <button @click="go('howItWorks')" :class="currentRoute==='howItWorks' ? 'text-brand-orange bg-brand-orange/10' : 'text-gray-600 dark:text-gray-300 hover:text-brand-orange'" class="px-3 py-2 rounded-lg transition-all">How It Works</button>
                <button @click="go('contact')" :class="currentRoute==='contact' ? 'text-brand-orange bg-brand-orange/10' : 'text-gray-600 dark:text-gray-300 hover:text-brand-orange'" class="px-3 py-2 rounded-lg transition-all">Contact</button>
                <button @click="go('legal')" :class="currentRoute==='legal' ? 'text-brand-orange bg-brand-orange/10' : 'text-gray-600 dark:text-gray-300 hover:text-brand-orange'" class="px-3 py-2 rounded-lg transition-all">Legal</button>
            </nav>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div x-show="!isOnline" class="hidden sm:flex items-center gap-1 bg-red-100 dark:bg-red-900/30 px-2.5 py-1.5 rounded-full text-xs font-bold text-red-600 dark:text-red-400">
                    <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>Offline
                </div>
                <div x-show="pendingSyncCount > 0" class="hidden sm:flex items-center gap-1 bg-yellow-100 dark:bg-yellow-900/30 px-2.5 py-1.5 rounded-full text-xs font-bold text-yellow-600 dark:text-yellow-400">
                    <i class="fa-solid fa-sync fa-spin text-[10px]"></i><span x-text="pendingSyncCount"></span> pending
                </div>
                <button @click="toggleLang()" class="hidden sm:flex items-center gap-1 bg-gray-100 dark:bg-gray-800 px-2.5 py-1.5 rounded-full text-xs font-bold cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <span>&#127482;&#127480;</span><span x-text="currentLang.toUpperCase()"></span>
                </button>
                <button @click="toggleDark()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors">
                    <i class="fa-solid text-sm" :class="darkMode ? 'fa-sun text-yellow-400' : 'fa-moon'"></i>
                </button>
                <template x-if="!isLoggedIn">
                    <div class="flex items-center space-x-2">
                        <button @click="go('onboarding')" class="hidden sm:block text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-brand-orange px-3 py-2 transition-colors">Sign In</button>
                        <button @click="go('onboarding')" class="bg-brand-orange hover:bg-brand-lightOrange text-white px-4 sm:px-5 py-2 rounded-full text-xs font-bold shadow-md transition-all transform active:scale-95">Get Started</button>
                    </div>
                </template>
                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-2 sm:space-x-3">
                        <button @click="activeModal='notifications'" class="relative p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors">
                            <i class="fa-regular fa-bell text-sm"></i>
                            <span x-show="unreadCount > 0" class="absolute top-1 right-1 w-2 h-2 bg-brand-orange rounded-full animate-pulse"></span>
                        </button>
                        <div class="hidden sm:flex items-center space-x-2 cursor-pointer pl-2 sm:pl-3 border-l border-gray-200 dark:border-gray-700" @click="go('profile')">
                            <img :src="userAvatar" alt="Avatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover border-2 border-brand-orange/60">
                            <div class="hidden lg:block text-left">
                                <p class="text-xs font-bold leading-none" x-text="userName"></p>
                                <span class="text-[10px] text-brand-orange font-semibold">Heshima: <span x-text="heshimaScore"></span></span>
                            </div>
                        </div>
                        <a x-show="userRole === 'admin'" href="admin.html" target="_blank" class="p-2 rounded-full hover:bg-emerald-50 dark:hover:bg-emerald-950/30 text-gray-400 hover:text-emerald-600 transition-colors" title="Admin Dashboard">
                            <i class="fa-solid fa-gauge-high text-sm"></i>
                        </a>
                        <button @click="confirmLogout()" class="p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-950/30 text-gray-400 hover:text-red-500 transition-colors" title="Log Out">
                            <i class="fa-solid fa-right-from-bracket text-sm"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- ═══════ MAIN VIEWS ═══════ -->
    <main class="flex-1 w-full relative">

        <!-- LANDING -->
        <template x-if="currentRoute==='landing'">
            <div class="animate-fadeIn">
                <section class="relative bg-gradient-to-br from-brand-darkGreen via-brand-green to-emerald-800 text-white py-20 sm:py-28 px-4 overflow-hidden">
                    <div class="absolute inset-0 kenyan-pattern opacity-[0.06]"></div>
                    <div class="absolute top-0 right-0 w-96 h-96 bg-brand-orange/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                    <div class="max-w-5xl mx-auto text-center space-y-6 relative z-10">
                        <span class="inline-flex items-center space-x-2 bg-brand-orange/20 border border-brand-orange/30 text-brand-lightOrange px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider animate-float">
                            <i class="fa-solid fa-shield-halved"></i><span>Our Knowledge, Our Stories, Our Future</span>
                        </span>
                        <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight leading-[1.1]">
                            The Premier East African Hub for<br class="hidden sm:block"> <span class="text-brand-orange">Localized Wisdom</span>
                        </h1>
                        <p class="text-sm sm:text-lg text-gray-200 max-w-2xl mx-auto leading-relaxed">
                            Connect across counties through verified agricultural insights in <strong class="text-brand-lightOrange">#KilimoSmart</strong>, software engineering, live audio barazas, and peer-reviewed community trust scores.
                        </p>
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
                            <button @click="go(isLoggedIn ? 'feed' : 'onboarding')" class="w-full sm:w-auto bg-brand-orange hover:bg-brand-lightOrange text-white font-bold px-8 py-4 rounded-full shadow-xl text-sm transition-all transform hover:-translate-y-0.5 active:scale-95">Join Community Free <i class="fa-solid fa-arrow-right ml-2"></i></button>
                            <button @click="go('howItWorks')" class="w-full sm:w-auto bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-8 py-4 rounded-full text-sm transition-all backdrop-blur-sm">Explore Features <i class="fa-solid fa-compass ml-2"></i></button>
                        </div>
                        <div class="flex items-center justify-center gap-8 sm:gap-16 pt-8 text-center">
                            <div><div class="text-2xl sm:text-3xl font-black text-brand-orange">50K+</div><div class="text-xs text-gray-300">Members</div></div>
                            <div><div class="text-2xl sm:text-3xl font-black text-brand-orange">120K+</div><div class="text-xs text-gray-300">Answers Shared</div></div>
                            <div><div class="text-2xl sm:text-3xl font-black text-brand-orange">47</div><div class="text-xs text-gray-300">Counties</div></div>
                        </div>
                    </div>
                </section>
                <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-20 space-y-12">
                    <div class="text-center space-y-3 max-w-3xl mx-auto">
                        <h2 class="text-2xl sm:text-4xl font-black">Built by Community, Powered by Verification</h2>
                        <p class="text-sm text-gray-500">KikwetuConnect bridges traditional storytelling and modern digital infrastructure.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
                        <div class="bg-white dark:bg-brand-cardDark border border-gray-200 dark:border-gray-800 p-8 rounded-3xl shadow-sm space-y-4 hover:border-brand-orange transition-all group hover:shadow-lg">
                            <div class="w-14 h-14 rounded-2xl bg-brand-orange/10 text-brand-orange flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">&#127805;</div>
                            <h3 class="text-xl font-bold">#KilimoSmart Agronomy</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Access home soil testing guides, crop protection advice, and connect directly with cooperative agricultural experts across the Rift Valley.</p>
                        </div>
                        <div class="bg-white dark:bg-brand-cardDark border border-gray-200 dark:border-gray-800 p-8 rounded-3xl shadow-sm space-y-4 hover:border-brand-green transition-all group hover:shadow-lg">
                            <div class="w-14 h-14 rounded-2xl bg-brand-green/10 text-brand-green flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">&#127942;</div>
                            <h3 class="text-xl font-bold">Heshima Trust Karma</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Earn reliable trust points through peer-reviewed answers, timed county quizzes, and active participation in local educational forums.</p>
                        </div>
                        <div class="bg-white dark:bg-brand-cardDark border border-gray-200 dark:border-gray-800 p-8 rounded-3xl shadow-sm space-y-4 hover:border-blue-500 transition-all group hover:shadow-lg">
                            <div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">&#127908;&#65039;</div>
                            <h3 class="text-xl font-bold">Live Audio Baraza</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Host real-time discussions, leverage instant English-Kiswahili translation toggles, and share vital knowledge instantly.</p>
                        </div>
                    </div>
                </section>
                <section class="bg-gray-50 dark:bg-gray-900/50 py-16 px-4">
                    <div class="max-w-5xl mx-auto space-y-10">
                        <h2 class="text-2xl sm:text-3xl font-black text-center">Voices from the Community</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                            <div class="bg-white dark:bg-brand-cardDark p-6 rounded-2xl border border-gray-200 dark:border-gray-800 space-y-3">
                                <div class="flex items-center space-x-3">
                                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-full object-cover">
                                    <div><p class="text-sm font-bold">Mkulima Jane</p><p class="text-[10px] text-gray-400">Farmer, Kitale</p></div>
                                </div>
                                <p class="text-xs text-gray-500 leading-relaxed italic">"Through #KilimoSmart I learned drought-resistant farming techniques that saved my maize harvest. Asante Kikwetu!"</p>
                            </div>
                            <div class="bg-white dark:bg-brand-cardDark p-6 rounded-2xl border border-gray-200 dark:border-gray-800 space-y-3">
                                <div class="flex items-center space-x-3">
                                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-full object-cover">
                                    <div><p class="text-sm font-bold">Yonas Boley</p><p class="text-[10px] text-gray-400">Developer, Nairobi</p></div>
                                </div>
                                <p class="text-xs text-gray-500 leading-relaxed italic">"Found my co-founder through the Tech Kenya space. The Heshima system builds real trust."</p>
                            </div>
                            <div class="bg-white dark:bg-brand-cardDark p-6 rounded-2xl border border-gray-200 dark:border-gray-800 space-y-3">
                                <div class="flex items-center space-x-3">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-full object-cover">
                                    <div><p class="text-sm font-bold">Amina Hassan</p><p class="text-[10px] text-gray-400">Teacher, Mombasa</p></div>
                                </div>
                                <p class="text-xs text-gray-500 leading-relaxed italic">"The live audio barazas are perfect for parent-teacher discussions. Swahili-English toggle is a game changer."</p>
                            </div>
                        </div>
                    </div>
                </section>
                <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-brand-cardDark py-10 text-center text-xs text-gray-500 space-y-4">
                    <div class="flex justify-center space-x-6 font-medium">
                        <button @click="go('landing')" class="hover:text-brand-orange transition-colors">Home</button>
                        <button @click="go('howItWorks')" class="hover:text-brand-orange transition-colors">How It Works</button>
                        <button @click="go('contact')" class="hover:text-brand-orange transition-colors">Contact</button>
                        <button @click="go('legal')" class="hover:text-brand-orange transition-colors">Legal</button>
                    </div>
                    <p>&copy; 2026 KikwetuConnect. Maarifa Yetu, Hadithi Zetu, Mustakabali Wetu.</p>
                </footer>
            </div>
        </template>

        <!-- ONBOARDING -->
        <template x-if="currentRoute==='onboarding'">
            <div class="max-w-xl mx-auto px-4 py-12 sm:py-16 animate-fadeIn">
                <div class="bg-white dark:bg-brand-cardDark border border-gray-200 dark:border-gray-800 p-6 sm:p-8 rounded-3xl shadow-2xl space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-12 h-12 rounded-2xl bg-brand-orange text-white mx-auto flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-user-plus"></i></div>
                        <h2 class="text-2xl font-black font-logo" x-text="authMode === 'signup' ? 'Join KikwetuConnect' : 'Welcome Back'"></h2>
                        <p class="text-xs text-gray-500" x-text="authMode === 'signup' ? 'Create your account to start sharing knowledge.' : 'Log in to your account.'"></p>
                    </div>
                    <!-- Auth mode toggle -->
                    <div class="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1">
                        <button @click="authMode='signup'" :class="authMode==='signup' ? 'bg-white dark:bg-gray-700 shadow text-brand-orange' : 'text-gray-500'" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all">Sign Up</button>
                        <button @click="authMode='login'" :class="authMode==='login' ? 'bg-white dark:bg-gray-700 shadow text-brand-orange' : 'text-gray-500'" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all">Log In</button>
                    </div>
                    <!-- Login Mode -->
                    <div x-show="authMode==='login'" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500">Email</label>
                            <input type="email" x-model="userEmail" placeholder="you@example.com" class="w-full p-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 focus:border-brand-orange transition-all">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500">Password</label>
                            <input type="password" x-model="userPassword" placeholder="Your password" class="w-full p-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 focus:border-brand-orange transition-all">
                        </div>
                        <button @click="loginWithEmail()" class="w-full bg-brand-green hover:bg-brand-darkGreen text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition-all transform active:scale-95">Log In</button>
                        <div class="relative my-2">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-700"></div></div>
                            <div class="relative flex justify-center text-xs"><span class="bg-white dark:bg-brand-bgDark px-3 text-gray-400">or</span></div>
                        </div>
                        <button @click="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 py-3 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all text-sm font-medium">
                            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                            Continue with Google
                        </button>
                    </div>
                    <!-- Signup Mode - Step 1: Credentials -->
                    <div x-show="authMode==='signup' && onboardStep===1" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500">Full Name</label>
                            <input type="text" x-model="userName" placeholder="e.g. Samwel Nyamu" class="w-full p-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 focus:border-brand-orange transition-all">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500">Email <span class="text-brand-orange">*</span></label>
                            <input type="email" x-model="userEmail" placeholder="you@example.com" class="w-full p-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 focus:border-brand-orange transition-all">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500">Password <span class="text-brand-orange">*</span></label>
                            <input type="password" x-model="userPassword" placeholder="Min 6 characters" minlength="6" class="w-full p-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 focus:border-brand-orange transition-all">

            <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800 sticky top-0 bg-white dark:bg-brand-cardDark rounded-t-3xl sm:rounded-t-2xl z-10">
                <h3 class="text-base font-bold font-logo">Share Knowledge</h3>
                <button @click="activeModal=null" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="px-4 space-y-4">
                <div class="flex gap-2">
                    <button @click="selectPostType('question')" :class="newPostType==='question' ? 'border-brand-orange bg-brand-orange/10 text-brand-orange' : 'border-gray-200 dark:border-gray-700'" class="flex-1 py-2.5 border-2 rounded-xl text-xs font-bold transition-all">Question</button>
                    <button @click="selectPostType('post')" :class="newPostType==='post' ? 'border-brand-orange bg-brand-orange/10 text-brand-orange' : 'border-gray-200 dark:border-gray-700'" class="flex-1 py-2.5 border-2 rounded-xl text-xs font-bold transition-all">Educative Post</button>
                    <button @click="selectPostType('quiz')" :class="newPostType==='quiz' ? 'border-brand-orange bg-brand-orange/10 text-brand-orange' : 'border-gray-200 dark:border-gray-700'" class="flex-1 py-2.5 border-2 rounded-xl text-xs font-bold transition-all">Quiz</button>
                </div>
                <textarea x-model="newPostContent" rows="5" placeholder="Uliza swali, toa ushauri wa kitaalamu, ama andika hadithi..." class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 resize-none"></textarea>
                <div class="flex items-center justify-between text-gray-400 pb-2">
                    <div class="flex items-center space-x-4 text-lg">
                        <button class="hover:text-brand-orange transition-colors" title="Add Image"><i class="fa-regular fa-image"></i></button>
                        <button class="hover:text-brand-orange transition-colors" title="Voice Input"><i class="fa-solid fa-microphone"></i></button>
                        <button class="hover:text-brand-orange transition-colors" title="Add Poll"><i class="fa-solid fa-square-poll-vertical"></i></button>
                        <button class="hover:text-brand-orange transition-colors" title="Add Location"><i class="fa-solid fa-location-dot"></i></button>
                    </div>
                    <select x-model="newPostSpace" class="text-xs bg-gray-100 dark:bg-gray-800 p-2 rounded-lg font-semibold border-none focus:outline-none">
                        <option value="general">General Baraza</option>
                        <option value="kilimo">#KilimoSmart</option>
                        <option value="tech">Tech Kenya</option>
                        <option value="education">Elimu Yetu</option>
                        <option value="culture">Utamaduni</option>
                    </select>
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 dark:border-gray-800 flex justify-end space-x-3">
                <button @click="activeModal=null" class="px-4 py-2 rounded-full text-xs font-bold text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Cancel</button>
                <button @click="submitPost()" class="bg-brand-orange hover:bg-brand-lightOrange text-white px-6 py-2 rounded-full text-xs font-bold shadow-md transition-all transform active:scale-95">Post to Baraza</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICATIONS -->
    <div x-show="activeModal==='notifications'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" style="display:none;">
        <div class="bg-white dark:bg-brand-cardDark w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[80vh] overflow-auto" @click.away="activeModal=null" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-full sm:translate-y-0" x-transition:enter-end="translate-y-0">
            <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800 sticky top-0 bg-white dark:bg-brand-cardDark rounded-t-3xl sm:rounded-t-2xl">
                <h3 class="text-base font-bold font-logo">Notifications</h3>
                <div class="flex items-center space-x-2">
                    <button @click="markAllRead()" class="text-[10px] font-bold text-brand-orange hover:text-brand-lightOrange transition-colors">Mark all read</button>
                    <button @click="activeModal=null" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
            </div>
            <div class="p-4 space-y-3">
                <template x-for="notif in notifications" :key="notif.id">
                    <div class="flex items-start space-x-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-900 transition-colors hover:bg-gray-100 dark:hover:bg-gray-800">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0" :class="notif.iconBg"><i class="fa-solid" :class="notif.icon"></i></div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs leading-relaxed" x-html="notif.text"></p>
                            <span class="text-[10px] text-gray-400 mt-1 block" x-text="notif.time"></span>
                        </div>
                    </div>
                </template>
                <div x-show="notifications.length === 0" class="text-center py-8 text-gray-400">
                    <i class="fa-regular fa-bell-slash text-3xl mb-2"></i>
                    <p class="text-sm">No notifications yet</p>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGOUT CONFIRMATION -->
    <div x-show="activeModal==='logoutConfirm'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" style="display:none;">
        <div class="bg-white dark:bg-brand-cardDark w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-5" @click.away="activeModal=null" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="scale-95 opacity-0" x-transition:enter-end="scale-100 opacity-100">
            <div class="text-center space-y-3">
                <div class="w-14 h-14 rounded-full bg-red-100 dark:bg-red-950/40 flex items-center justify-center mx-auto">
                    <i class="fa-solid fa-right-from-bracket text-red-500 text-xl"></i>
                </div>
                <h3 class="text-lg font-bold font-logo">Log Out?</h3>
                <p class="text-sm text-gray-500">You'll need to sign in again to access your Heshima score, posts, and communities.</p>
            </div>
            <div class="flex gap-3">
                <button @click="activeModal=null" class="flex-1 py-3 rounded-xl text-sm font-bold border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">Cancel</button>
                <button @click="logout()" class="flex-1 py-3 rounded-xl text-sm font-bold bg-red-500 hover:bg-red-600 text-white shadow-lg transition-all transform active:scale-95">Log Out</button>
            </div>
        </div>
    </div>

    <!-- PROFILE EDIT MODAL -->
    <div x-show="activeModal==='editProfile'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" style="display:none;">
        <div class="bg-white dark:bg-brand-cardDark w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[90vh] overflow-auto" @click.away="activeModal=null" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-full sm:translate-y-0" x-transition:enter-end="translate-y-0">
            <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800 sticky top-0 bg-white dark:bg-brand-cardDark rounded-t-3xl sm:rounded-t-2xl z-10">
                <h3 class="text-base font-bold font-logo">Edit Profile</h3>
                <button @click="activeModal=null" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <div class="flex flex-col items-center space-y-3">
                    <div class="relative">
                        <img :src="userAvatar" class="w-20 h-20 rounded-2xl object-cover border-4 border-brand-orange/30 shadow-lg">
                        <button class="absolute -bottom-1 -right-1 w-7 h-7 bg-brand-orange rounded-full flex items-center justify-center text-white text-xs shadow-md"><i class="fa-solid fa-camera"></i></button>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-500">Full Name</label>
                        <input type="text" x-model="userName" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-500">Username</label>
                        <div class="flex">
                            <span class="flex items-center px-3 bg-gray-100 dark:bg-gray-800 border border-r-0 border-gray-200 dark:border-gray-700 rounded-l-xl text-sm font-bold text-gray-400">@</span>
                            <input type="text" x-model="userHandle" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-r-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-500">County</label>
                        <select x-model="userCounty" class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 font-medium">
                            <option>Baringo</option><option>Bomet</option><option>Bungoma</option><option>Busia</option><option>Elgeyo-Marakwet</option><option>Embu</option><option>Garissa</option><option>Homa Bay</option><option>Isiolo</option><option>Kajiado</option><option>Kakamega</option><option>Kericho</option><option>Kiambu</option><option>Kilifi</option><option>Kirinyaga</option><option>Kisii</option><option>Kisumu</option><option>Kitui</option><option>Kwale</option><option>Laikipia</option><option>Lamu</option><option>Machakos</option><option>Makueni</option><option>Mandera</option><option>Marsabit</option><option>Meru</option><option>Migori</option><option>Mombasa</option><option>Nairobi</option><option>Nakuru</option><option>Nandi</option><option>Narok</option><option>Nyamira</option><option>Nyandarua</option><option>Nyeri</option><option>Samburu</option><option>Siaya</option><option>Taita-Taveta</option><option>Tana River</option><option>Tharaka-Nithi</option><option>Trans-Nzoia</option><option>Turkana</option><option>Uasin Gishu</option><option>Vihiga</option><option>Wajir</option><option>West Pokot</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-500">Bio</label>
                        <textarea rows="3" placeholder="Tell the community about yourself..." class="w-full p-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange/50 resize-none"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 dark:border-gray-800 flex justify-end space-x-3">
                <button @click="activeModal=null" class="px-4 py-2 rounded-full text-xs font-bold text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Cancel</button>
                <button @click="updateProfile({ userName, userHandle, userCounty }); activeModal=null" class="bg-brand-green hover:bg-brand-darkGreen text-white px-6 py-2 rounded-full text-xs font-bold shadow-md transition-all transform active:scale-95">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div x-show="toastVisible" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-4 opacity-0" x-transition:enter-end="translate-y-0 opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100" x-transition:leave-end="translate-y-4 opacity-0" class="fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 z-[70] bg-brand-green text-white px-6 py-3 rounded-2xl shadow-xl text-sm font-medium max-w-xs text-center" style="display:none;" x-text="toastMessage"></div>

    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="supabase.js"></script>
    <script src="offline.js"></script>
    <script src="app.js"></script>
</body>
</html>
